# Release candidates and promotion, driven by a per-project config file.
# Run from: Actions -> Release -> Run workflow.  Full guide: .github/RELEASING.md
name: Release

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to release (config: .github/release-configs/<project>.json)'
        type: choice
        # GitHub needs this list written out: add one line per file in .github/release-configs/
        options:
          - uprint
        required: true
      action:
        description: 'rc = new RC0 from milestone | fix = next RC on the open RC branch | promote = tag RC as final release, rename branch to project-version-release'
        type: choice
        options: [rc, fix, promote]
        required: true
      milestone_branch:
        description: 'Milestone branch to cut RC0 from (required for "rc")'
        type: string
        required: false
      bump:
        description: 'Version bump (only used by "rc")'
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'X.Y.Z of the RC to act on (fix/promote; only needed if several RCs are open)'
        type: string
        required: false
      dry_run:
        description: 'Print what would change, push nothing'
        type: boolean
        default: false

# Never run two releases for the same project at once; queue instead of cancelling.
concurrency:
  group: release-${{ inputs.project }}
  cancel-in-progress: false

permissions:
  contents: write        # push branches and tags, create releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history + tags, needed to find versions

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG: .github/release-configs/${{ inputs.project }}.json
          MILESTONE_BRANCH: ${{ inputs.milestone_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          ACTION: ${{ inputs.action }}
          ARG: ${{ inputs.action == 'rc' && inputs.bump || inputs.version }}
        run: bash .github/scripts/release.sh "$ACTION" "$ARG"
