# CI: the same shape as pos-cr's eslint.yaml, plus PHP lint and JS tests.
name: CI

on:
  pull_request:            # runs on PRs whose *base* is one of these branches
    branches: [master]
  push:                    # runs after merge / direct push
    branches: [master]
  workflow_dispatch:       # adds a "Run workflow" button in the Actions tab

# A newer push to the same PR cancels the older, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the automatic GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest   # pos-cr uses [self-hosted, docker, linux, dev2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'          # caches ~/.npm keyed on package-lock.json

      - run: npm ci
      - run: npm run lint

  js-tests:
    name: JS tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # let every matrix leg finish even if one fails
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

  phpcs:
    name: PHP CodeSniffer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.2'    # match the PHP the code runs on
          tools: composer
          coverage: none

      - run: composer install --no-interaction --no-progress
      - run: composer lint
